apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stage
  labels:
    app: backend
    env: stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      env: stage
  template:
    metadata:
      labels:
        app: backend
        env: stage
    spec:
      containers:
        - name: backend
          image: dasujandb/support-chat-backend:stage-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            - name: CLIENT_URL
              value: "http://13.203.161.35:30012"
            - name: CHAT_PRIMARY_COLOR
              value: "#2563EB"
            - name: CHAT_SECONDARY_COLOR
              value: "#EFF6FF"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: stage
spec:
  type: NodePort
  selector:
    app: backend
    env: stage
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30011
