name: CI/CD - Backend Staging Environment

on:
  push:
    branches: [ stage ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Build & Validate Backend Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend Typecheck & Build
        run: |
          npm install
          npm run typecheck
          npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Traceable Version Tag
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +'%Y%m%d%H%M')
          echo "TAG=stage-${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Build & Push Staging Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            dasujandb/support-chat-backend:${{ steps.vars.outputs.TAG }}
            dasujandb/support-chat-backend:stage-latest

  deploy-stage:
    name: Deploy to Staging (Manual Approval Trigger)
    needs: validate-and-build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Manual Deployment
        run: echo "Manual deployment trigger executed for Backend Staging environment."
